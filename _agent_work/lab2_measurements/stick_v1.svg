<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <!-- v1: classic Weste/Harris stick style, too empty -->
  <rect width="900" height="420" fill="white"/>
  <text x="20" y="28" font-family="Arial" font-size="16" font-weight="bold">DFF Stick Diagram</text>
  <!-- rails -->
  <line x1="40" y1="70" x2="860" y2="70" stroke="#1e4fd6" stroke-width="6"/>
  <line x1="40" y1="360" x2="860" y2="360" stroke="#1e4fd6" stroke-width="6"/>
  <text x="8" y="76" fill="#1e4fd6" font-family="Arial" font-size="14">VDD</text>
  <text x="8" y="366" fill="#1e4fd6" font-family="Arial" font-size="14">VSS</text>
  <!-- demarcation -->
  <line x1="40" y1="215" x2="860" y2="215" stroke="#996633" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- pdiff / ndiff continuous -->
  <line x1="60" y1="120" x2="840" y2="120" stroke="#c48a2a" stroke-width="10"/>
  <line x1="60" y1="300" x2="840" y2="300" stroke="#2e9b4a" stroke-width="10"/>
  <!-- CLK inv poly -->
  <line x1="110" y1="95" x2="110" y2="325" stroke="#d22" stroke-width="4"/>
  <text x="95" y="90" fill="#d22" font-family="Arial" font-size="12">CLK</text>
  <!-- master polys -->
  <line x1="250" y1="95" x2="250" y2="325" stroke="#d22" stroke-width="4"/>
  <line x1="320" y1="95" x2="320" y2="325" stroke="#d22" stroke-width="4"/>
  <line x1="400" y1="95" x2="400" y2="325" stroke="#d22" stroke-width="4"/>
  <line x1="470" y1="95" x2="470" y2="325" stroke="#d22" stroke-width="4"/>
  <!-- slave -->
  <line x1="580" y1="95" x2="580" y2="325" stroke="#d22" stroke-width="4"/>
  <line x1="650" y1="95" x2="650" y2="325" stroke="#d22" stroke-width="4"/>
  <line x1="730" y1="95" x2="730" y2="325" stroke="#d22" stroke-width="4"/>
  <line x1="800" y1="95" x2="800" y2="325" stroke="#d22" stroke-width="4"/>
</svg>
